<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Change code</title>
</head>
<body>
    <div class="canvas">

    <h1>Color Scheme Switcher</h1>

    <span class="button" id="grey" style="background-color: gray; height:500;width:500">grey</span>
    <span class="button" id="white" style="background-color: white; height:500;width:500">white</span>
    <span class="button" id="blue" style="background-color: blue; height:500;width:500">blue</span>
    <span class="button" id="yellow" style="background-color: yellow; height:500;width:500">yellow</span>

    <h2>
        Try clicking on one of the colors above
        <span>to change the background color of the page!</span>
    </h2>

</div>
<script src="chaiaurcode.js"></script>
