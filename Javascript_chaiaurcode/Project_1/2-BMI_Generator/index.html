<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Index Calculator</title>
</head>
<body style="background-color: #212121; color: #ffff">
    <nav>
        <a href="/" aria-current="page">Home</a>
   
        <a target="_blank" href="https://www.youtube.com/@chaiaurcode">You tube channel</a>
    </nav>

    <form>
    <h1>BMI Index Calculator</h1>

    <p><label>Height In CM</label>
    <input type="number" id="height"/>
    </p>
    <label>Weight In KG</label>
    <input type="number" id="weight"/>
    <br/><br/>
    <button id="calculate">Calculate</button> <!-- In case of form button default event is submit -->
    
    <br/><br/>
    <div id="results"></div>

    <br/>
    <div id="weight-guide">
        <label>Under Weight = Less than 18.6</label> <br/>
        <label>Normal Weight = 18.6 and 24.9</label> <br/>
        <label>Over Weight = Greater than 24.9</label>

    </div>

</form>

<script src="chaiaurcode.js"></script>
</body>
</html>
