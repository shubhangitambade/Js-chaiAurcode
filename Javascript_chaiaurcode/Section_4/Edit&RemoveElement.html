<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit and Remove Element</title>
</head>
<body style="background-color:beige;color:brown">

    <ul class="language"> 
        <li>Javascript</li>
    </ul>
    

    <script>
        function addLanguage(langName){

            const li = document.createElement('li')
            li.innerHTML = `${langName}`;

            document.querySelector('.language').appendChild(li);
            
        }

        /*
            In this case list will traverse till end then newitem will 
            add But if there are lakh items in the list then such type of traversing
             is very difficult to add new item in the list
        */
        addLanguage("python");
        addLanguage("typescript");


        function addOptiLanguage(langName){

            const li = document.createElement('li');
            const addText = document.createTextNode(langName);
            li.appendChild(addText);

            document.querySelector('.language').appendChild(li);

        }

        addOptiLanguage('golang');

        //Edit

       const secondLang =  document.querySelector("li:nth-child(2)");
       console.log(secondLang);
       
       //scondLang.innerHTML = "Mojo";
        //But innerHTML will do whole traversing so use optimize option

        const newli = document.createElement('li');
        newli.textContent = "Mojo";
        secondLang.replaceWith(newli);

        //? Try following
        //const firstLang = document.querySelector("li:first-child");
        
        //firstLang.outerHTML = '<li>Typescript<li>'
       
       
            //Remove

            const lastLang = document.querySelector('li:last-child');
            lastLang.remove();
    </script>
</body>
</html>
