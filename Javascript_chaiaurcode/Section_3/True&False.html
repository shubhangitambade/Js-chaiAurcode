    <title>True and False</title>
</head>
<body>
    

    <script>
       // const userEmail = "hitesh@gmail.com";
        //const userEmail = "";
        const userEmail = [];
        if(userEmail){

            console.log("Got user email..");
        }
        else{
            console.log("Don't have user Email..");
        }

        //falsy values
       // false,0,-0,BigInt 0n ,"",null,undefined,NaN
        //Remaining are truthy values

        //Truthy values
        // "0" , 'false' , " ", [] , {} ,function(){} ....
        if(userEmail.length === 0)
        {
            console.log("Array is empty...");

        }

        const emptyObject = {};
        if(Object.keys(emptyObject).length === 0)
        {
            console.log("Object is empty...");
        }

        //Nullish Coalescing Operator(??) [depends on null undefined] [This operator is different from ternary operator]

        let val1;
       // val1 =5 ?? 10;
       // console.log(val1); //output : 5

       // val1 = null ?? 10;
       // console.log(val1); //output : 10

        val1 = undefined ?? 15
        console.log(val1); //output : 15

        val2 = null ?? 10 ?? 50
        console.log(val2); //output : 10

        //Ternary operator : condition ?  true : false
        const iceTeaPrice = 100;
        iceTeaPrice >= 80 ? console.log("less than 80"):console.log("Greater than 80");

        

        
    </script>
