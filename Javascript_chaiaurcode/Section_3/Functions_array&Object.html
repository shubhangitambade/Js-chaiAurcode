    <script>
            function calculateCartPrice(...num1) //Here ... refers to rest operator,multiple values passed as argument but paarmeter is only one in this case ... will combine 3 values.
            {
                return num1;
            }

            console.log(calculateCartPrice(200,400,500));

            function calculateCartPrice2(val1,val2,...num1) 
            {
                return num1;
            }

            console.log(calculateCartPrice2(200,400,500,2000));//[output is : [500,2000] here 200 goes to val1 ,400 goes to val2 and rest values goes to ...num1 ]
