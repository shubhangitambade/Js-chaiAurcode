        console.log("--------------------- About Memory ---------------------");
       // Stack(Primitive type) And Heap(Non-primitive type)

       //In case "stack memeory" you will get copy of that variable (which you declared)
       //In case of "heap memery"  you will get reference of original values so any change in value of variable will 
       //reflect to the original location.


       let myYoutubename = "shubhatdotcom";
       console.log("myYoutubename :",myYoutubename);

       let anothername = myYoutubename;
       console.log("anothername : ",anothername);

        let userOne = {

        }

        let userTwo = userOne;
        console.log("userTwo :: ",userTwo);

        userTwo.email = "hitesh@google.com";
        console.log("After changing the email of userTwo : ");
        console.log("userOne email :: ",userOne.email);//output : hitesh@google.com
        console.log("userTwo email :: ",userTwo.email); //output : hitesh@google. As both object pointing to same reference changes made by any object will reflect in both objects.
        //Here userOne is on stack and it's reference is on heap
        //means {email:"user@google.com",upi:"user@ybl"} and userTwo(which is on stack) pointing to the same reference
