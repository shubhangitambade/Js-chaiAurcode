<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript Basics 08</title>
</head>
<body>
    

    <script>
        const score = 400;
        console.log(score);

        console.log(score.toFixed(2));

        const balance = new Number(100);//balance is object of type Number.So prototypes avialable
        console.log(balance);

        console.log(balance.toString()); //Converted Number Object to String Object.
        console.log(balance.toString().length); //So String Object properties will get.
        console.log("---------------------------");
        const otherNumber1 = 23.8966;
        console.log("Number 1 :",otherNumber1);
        console.log(otherNumber1.toPrecision(3));

        const otherNumber2 = 123.8966;
        console.log("Number 2 :",otherNumber2);
        console.log(otherNumber2.toPrecision(3));  
        
        const otherNumber3 = 1123.8966;
        console.log("Number 3 :",otherNumber3);
        console.log(otherNumber3.toPrecision(3));

        console.log("---------------------------");
        const hundreds = 1000000;
        console.log(hundreds.toLocaleString());

        console.log("According to Indian Standard ",hundreds.toLocaleString('en-IN'));


        //------------------------ MAths -------------------------------------
        console.log("--------------------- MAths -----------------------");
        console.log(Math);
        console.logg(Math.abs(-4));

        console.log(Math.round(4.6));
        console.log(Math.round(4.3));

        console.log(Math.floor(4.9));
        console.log(Math.floor(4.2));

        console.log(Math.min(3,1,10,9));
        console.log(Math.max(3,1,10,9));

        console.log(Math.random()); //Always comes values betn 0 to 1 only.(Mostly decimal)
        console.log(Math.random() * 10);

        console.log(Math.random() * 10 + 1 );
        console.log((Math.random() * 10 )+ 1 );

        console.log((Math.floor(Math.random() * 10 )+ 1 ));

        const min = 10;
        const max=20;
       console.log( Math.random() + (max - min + 1));

       console.log(Math.floor(Math.random() + (max - min + 1)) + min);
       







    </script>
</body>
