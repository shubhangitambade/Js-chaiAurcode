<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object Part 2</title>
</head>
<body>
    <script>
        //Singleton object 
        const tinderUser1 = new Object();
        console.log(tinderUser1);


        //Non Singleton Object
        const tinderUser2 = {};
       // console.log(tinderUser2);

        const tinderUser = {};
        tinderUser.id = "123abc";
        tinderUser.name = "Sammy";
        tinderUser.isLoggedIn = false;

       // console.log(tinderUser);

        console.log("-------------------------");
        const regularUser = {
            email:"some@gmail.com",
            fullname:{

                userfullname:{
                    firstname:"hitesh",
                    lastname:"choudhary"
                }
            }

        }
        
        console.log(regularUser.fullname);
        console.log(regularUser.fullname?.userfullname); //? : represents optional chaining(protection when data comes from api api data )
        console.log(regularUser.fullname.userfullname.firstname);


        const obj1 = {
            1:"a",
            2:"b"
        }

        const obj2 = {

            3:"a",
            4:"b"
        }

        const obj4 = {5:"aa",6:"bb"};
       // const obj3 ={obj1 , obj2};
       // console.log(obj3);

       // const obj3 = Object.assign({},obj1,obj2,obj3);
       // console.log(obj3);

        const obj3 = {...obj1, ...obj2, ...obj4}; //First we spread obj1 ,obj2 and obj4  and store combined of three in obj3.
        console.log(obj3);

        //Array of object may come from database

        //e.g:

        const users = [
            {
                id:1,
                email:"h@gmail.com"
            },
            {
                id:2,
                email:"k@gmail.com"
            },
            {
                id:3,
                email:"m@gmail.com"
            },
            {
                id:4,
                email:"n@gmail.com"
            }
        ]

        console.log(users[1].email);

        console.log(" ------------------------------------ ");
        console.log("tinderUser : ",tinderUser);

        console.log(Object.keys(tinderUser));

        console.log(Object.values(tinderUser));

        console.log(Object.entries(tinderUser));
    
    
        console.log(tinderUser.hasOwnProperty('isLoggedIn'));
        
    </script>
</body>
</html>
